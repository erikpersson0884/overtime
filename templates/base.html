<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f6f54">
  <title>{% block title %}Overtime{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.get('auth') %}
  <header class="top">
    <a class="brand" href="{{ url_for('log') }}">Overtime</a>
    <div class="top-actions">
      <a class="header-button" href="{{ url_for('settings') }}" {% if request.endpoint == 'settings' %}aria-current="page"{% endif %}>Settings</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="header-button" type="submit">Log out</button>
      </form>
    </div>
  </header>
  {% endif %}

  <main>
    {% for message in get_flashed_messages() %}
      <p class="flash" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  {% if session.get('auth') %}
  <nav class="tabs">
    <a href="{{ url_for('log') }}" class="{{ 'on' if request.endpoint in ('log', 'edit') }}">Log time</a>
    <a href="{{ url_for('overview') }}" class="{{ 'on' if request.endpoint == 'overview' }}">Overview</a>
  </nav>
  {% endif %}
  <script src="{{ url_for('static', filename='app.js') }}"
          data-service-worker-url="{{ url_for('service_worker') }}" defer></script>
</body>
</html>
