{% extends "base.html" %}
{% block title %}Settings - Overtime{% endblock %}
{% block content %}
<h1>Settings</h1>
<form method="post" class="card settings-form">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <label for="theme">Theme</label>
  <select id="theme" name="theme" required>
    <option value="default" {% if theme == 'default' %}selected{% endif %}>Default</option>
    <option value="meadow" {% if theme == 'meadow' %}selected{% endif %}>Meadow</option>
  </select>
  <p class="hint">Default follows your device's light or dark appearance. Meadow uses a warm, light palette.</p>
  <button class="primary" type="submit">Save settings</button>
</form>
{% endblock %}
